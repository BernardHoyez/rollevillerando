<script>
var wps=[{"name":"Portail récent","lat":49.4663396,"lon":0.6264861,"alt":0,"comment":"","photo":"photos/6efdd41b-bfeb-4b22-ad08-749a9bd4445b.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Le château d'Etelan","lat":49.46635450000001,"lon":0.6265549,"alt":0,"comment":"Bâti au début de la Renaissance italienne en Normandie, le château d'Etelan domine fièrement la boucle de la Seine. Observez cette alternance de pierre calcaire et de brique : c'est un appareil en « damier » typique du Val de Seine, conçu pour capter la lumière rasante des fins d'après-midi. L'anecdote raconte qu'en 1563, la jeune Catherine de Médicis et son fils Charles IX y séjournèrent pour signer l'Édit d'Amboise, mettant une trêve aux guerres de Religion. En cadrant depuis le bas de l'escarpement, vous saisirez toute la verticalité du logis seigneurial et la finesse de sa chapelle flamboy","photo":"photos/39b10d63-4e18-4472-95dc-27d2fd6bf319.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Pancarte","lat":49.466374,"lon":0.6266069,"alt":0,"comment":"","photo":"photos/12eae58c-58c8-44d4-9517-4e6b7fad7c71.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Le château de face","lat":49.4666674,"lon":0.6272827,"alt":0,"comment":"Le château d’Ételan, situé à Saint-Maurice-d’Ételan, en Seine-Maritime, domine un méandre de la Seine et constitue un remarquable témoignage de la transition entre le gothique flamboyant et la Renaissance en Normandie. Édifié à la fin du XVe siècle, il associe une architecture de tradition médiévale à des éléments décoratifs annonçant le nouvel art de la Renaissance. Son histoire est liée aux grandes transformations politiques et culturelles de cette période, ainsi qu’aux familles qui l’ont successivement occupé. \nLe domaine conserve également la mémoire d’un ancien château fort médiéval?","photo":"photos/d4a54dd7-3397-487d-8ad0-6033e8d35c01.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Portail ancien","lat":49.4669841,"lon":0.6278746,"alt":0,"comment":"","photo":"photos/6ad4d97b-f9db-4799-8f44-2b04b43f8e0a.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Noyer de virginie","lat":49.46802078022226,"lon":0.630168914794922,"alt":85,"comment":"Le noyer de Virginie (Carya illinoinensis ou pacanier, selon l’appellation parfois employée à tort) doit être distingué du noyer commun (Juglans regia), originaire d’Eurasie et largement cultivé en Europe. Le premier appartient au genre Carya, tandis que le second relève du genre Juglans : ils appartiennent tous deux à la famille des Juglandacées, mais constituent des genres botaniques distincts.","photo":"photos/2026-10-13t09_41_20_02_00_loc.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Eglise Saint-Martin de Norville","lat":49.47345159999999,"lon":0.6363285,"alt":0,"comment":"L’église Saint-Martin de Norville témoigne de plusieurs siècles d’histoire religieuse et architecturale normande. Un premier édifice, lié à l’abbaye de Jumièges, est attesté dès le XIIIe siècle. Après la guerre de Cent Ans, l’église est profondément remaniée : le transept et sa tour de croisée sont reconstruits au XVe siècle, puis la nef est élevée au XVIe siècle. La flèche du clocher, achevée vers 1500, fut endommagée par la foudre en 1862, puis restaurée à une hauteur réduite. Classée monument historique le 21 mars 1910, l’église conserve notamment des graffitis de navires.","photo":"photos/69799e6a-91d9-469b-9efd-5df629c184a5.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Navire sur la Seine","lat":49.477022,"lon":0.6406193,"alt":0,"comment":"Entre Le Havre et Rouen, la basse Seine est une artère maritime où croisent des cargos, vraquiers de céréales, pétroliers et grands paquebots de croisière. Plus en amont et vers Paris, le fleuve devient exclusivement fluvial. On y croise des convois poussés et automoteurs grand gabarit transportant du fret (conteneurs, matériaux), ainsi que des péniches Freycinet. Le tourisme s'y épanouit grâce aux bateaux-mouches, hôtels flottants et vedettes, tandis que péniches-logements et ERP flottants ponctuent les berges.","photo":"photos/23d90b6b-b917-4ad7-9012-55928a0008f9.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Poteau indicateur","lat":49.48997120000001,"lon":0.6361132,"alt":0,"comment":"La Seine-Maritime offre un terrain de randonnée exceptionnel entre mer, fleuve et bocage. Le phare du département est le GR® 21 (Sentier des Falaises), reliant Le Havre au Tréport le long des spectaculaires falaises de la Côte d’Albâtre. Côté terre, le GR® 2 longe les meandres de la Seine, ses abbayes et ses forêts, tandis que le GR® 210 suit l'historique route du Chasse-Marée entre Dieppe et Rouen. En complément, des centaines de boucles de petite randonnée (PR) traversent le Pays de Caux, le Pays de Bray et la forêt d'Eawy.   ","photo":"photos/7b1a2b03-7842-424d-b6c6-67a3127cb80f.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Maison à colombages","lat":49.49292389991915,"lon":0.6334384423847484,"alt":0,"comment":"En Seine-Maritime, la maison à colombages s'exprime sous deux visages. En ville, Rouen en est le joyau avec plus de 2 000 façades sculptées à encorbellement, concentrées dans ses ruelles médiévales (rue Eau-de-Robec, place Saint-Maclou). En campagne, elle devient chaumière rustique au cœur du Pays de Caux et le long de la Route des Chaumières (Boucles de la Seine). Son ossature en chêne repose sur un soubassement de silex et grès, garnie de torchis ou briques, incarnant avec grâce le patrimoine bâti normand entre terre et fleuve.","photo":"photos/72b171e6-e613-4d38-883e-f67e12955cf7.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Séneçon jacobée","lat":49.4895397,"lon":0.6173751,"alt":0,"comment":"Le séneçon jacobée (Jacobaea vulgaris, anciennement Senecio jacobaea) est une plante herbacée bisannuelle, parfois vivace, de la famille des Astéracées, pouvant atteindre 1 m de hauteur. Il se reconnaît à ses tiges dressées, souvent ramifiées dans leur partie supérieure, et à ses feuilles profondément découpées en segments irréguliers. De juin à septembre, il porte des capitules jaune vif réunis en corymbes, chaque fleur présentant un disque central et des ligules périphériques. Fréquent dans les prairies, les friches et les bords de chemins, il est toxique pour le bétail .","photo":"photos/018e31b4-832c-4af9-9b24-970e569b3769.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Orée de forêt","lat":49.4878624,"lon":0.6120815,"alt":0,"comment":"Les forêts de Seine-Maritime présentent une composition végétale caractéristique du domaine atlantique tempéré. Le hêtre (Fagus sylvatica) domine de nombreuses hêtraies, notamment dans les forêts d’Eawy, de Lyons et de Brotonne. Le chêne pédonculé et le chêne sessile occupent également une place importante, accompagnés du charme, du frêne, de l’érable sycomore et du merisier. Les sols humides favorisent l’aulne glutineux et les saules, tandis que le bouleau colonise les milieux perturbés. Le pin sylvestre, l’épicéa et le douglas témoignent des plantations forestières.","photo":"photos/b9d62ae9-d1ca-441e-b153-eb1b378518db.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Raffinerie de Port Jérôme","lat":49.4815158,"lon":0.6033403,"alt":0,"comment":"La raffinerie de Port-Jérôme, implantée à Notre-Dame-de-Gravenchon, aujourd’hui intégrée à Port-Jérôme-sur-Seine, s’inscrit dans l’essor industriel de la vallée de la Seine au XXᵉ siècle. Sa création, en 1933, par la société américaine Standard Oil of New Jersey, répond à la volonté de développer une grande plateforme de raffinage à proximité du fleuve, des infrastructures portuaires et des axes d’approvisionnement en pétrole brut.\nLa mise en service intervient en mai 1933, avant son inauguration officielle en juin 1934. Partiellement détruite pendant la Seconde Guerre mondiale.","photo":"photos/c5a2f5a8-74bb-4a17-9202-c8e9ef76446a.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Molène","lat":49.47426579803129,"lon":0.6041622161865235,"alt":83,"comment":"La molène (Verbascum), ou Bouillon-blanc, se reconnaît d'abord à son allure majestueuse : une haute hampe florale pouvant dépasser 2 mètres. En été, elle arbore une floraison dense de fleurs jaune vif à 5 pétales légèrement inégaux, réunies en épis serrés. Ses feuilles sont tout aussi caractéristiques : très grandes à la base, elles sont couvertes d'un duvet cotonneux, épais et blanchâtre, particulièrement doux au toucher (qui sert à retenir l'eau). Sa rosette de feuilles veloutées la première année précède cette impressionnante chandelle dorée la seconde.","photo":"photos/2026-10-13t11_56_13_02_00_loc.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Eglise de Petiville","lat":49.46795620000001,"lon":0.6155084,"alt":0,"comment":"L’église Saint-Martin de Petiville conserve la mémoire d’un édifice médiéval dont les origines remontent au XIᵉ siècle. L’ancienne église, située près du cimetière actuel, possédait une nef romane, un chœur reconstruit en 1611 et une tour-porche élevée entre 1727 et 1731. Détruite au XIXᵉ siècle, elle fournit une partie des matériaux de l’édifice qui lui succéda. Celui-ci connut un épisode dramatique en 1958, lorsque son clocher s’effondra pendant des travaux, entraînant une partie de l’église. Un campanile le remplace aujourd’hui. Les vitraux de 1611, représentent les quatre Évangélistes .","photo":"photos/9a838f8a-54c9-4274-b643-6bbba12308c2.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Allée du château","lat":49.4673345,"lon":0.623556,"alt":0,"comment":"Le Château d'Ételan se visite d'avril à novembre, incluant ses somptueux extérieurs Renaissance, son parc arboré et sa chapelle flamboyante. Des visites guidées, souvent assurées par les propriétaires, permettent d'explorer les salons historiques et de retracer l'histoire du séjour de Catherine de Médicis. Le site propose aussi des expositions d'art et des événements culturels. Situé à Saint-Maurice-d'Ételan, il est accessible sur réservation pour les groupes ou lors des Journées du Patrimoine.","photo":"photos/23e4c97a-f9ff-4ec2-9fe5-15d30946083c.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Parking","lat":49.4664319,"lon":0.6260325,"alt":0,"comment":"","photo":"photos/c80d8354-31d2-49dd-a504-eedfb1d7ffd7.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Erable du Japon","lat":49.47995951091152,"lon":0.602102279663086,"alt":93,"comment":"L’érable du Japon (Acer palmatum) est un arbuste ou petit arbre ornemental de la famille des Sapindacées, reconnaissable à ses feuilles palmées, généralement découpées en cinq à neuf lobes pointus, aux marges dentées. Son feuillage, vert ou pourpre selon les cultivars, prend à l’automne des teintes spectaculaires, du jaune orangé au rouge écarlate. Ses rameaux fins et son port souvent étalé complètent son identification. Originaire d’Asie orientale, il apprécie les sols frais, drainés et légèrement acides, ainsi qu’une exposition lumineuse sans soleil brûlant. ","photo":"photos/2026-10-13t11_31_34_02_00_loc.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Cyclamen à feuilles de lierre","lat":49.46644653239129,"lon":0.6272184848785402,"alt":83,"comment":"Le cyclamen à feuilles de lierre (Cyclamen hederifolium) est une petite plante qui fleurit à la fin de l’été et en automne, souvent lorsque les feuilles commencent à tomber. Ses fleurs roses ou blanches, aux pétales dressés vers l’arrière, apparaissent sur de fines tiges. Ses feuilles arrondies, en forme de cœur et souvent décorées de marbrures argentées, rappellent celles du lierre. On le rencontre dans les sous-bois, au pied des arbres et dans les jardins ombragés. Après la floraison, son feuillage persiste en hiver, puis disparaît au printemps.","photo":"photos/2026-10-13t13_46_41_02_00_loc.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null}];
