var wps=[{"name":"Départ","lat":49.5826533,"lon":0.21433,"alt":39.27,"comment":"Grande randonnéeHeure de départ: 09:03 18 août 2026\nHeure d'arrivée: 11:29 18 août 2026\nDistance: 10,9km (02:26)\nTemps déplacement: 02:17\nVitesse moyenne: 4,46 km/h\nVitesse en mouvement: 4,74 km/h\nVitesse Max.: 6,40 km/h\nAltitude minimale: 36 m\nAltitude maximale: 116 m\nVitesse de montée: 117,7 m/h\nVitesse de descente: 160,2 m/h\nDénivelé positif: 137 m\nDénivelé négatif: 136 m\nTemps de montée: 01:10\nTemps de descente: 00:51","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Tonnelle","lat":49.5835017,"lon":0.2138817,"alt":38.04,"comment":"Nés au XIXe siècle, les jardins ouvriers (ou familiaux) offraient aux familles modestes des villes un lopin de terre pour cultiver des légumes et améliorer leur alimentation. Au-delà du soutien nourricier, ces espaces prônaient l'hygiénisme, l'autonomie et le lien social face à l'industrialisation. Aujourd'hui, ils perdurent sous forme de havres de verdure partagés, alliant écologie urbaine, convivialité et défense de la biodiversité.","photo":"photos/omimg_20260818_090611.jpg","audio":null,"video":null,"youtube":null},{"name":"Chene-pedoncule","lat":49.5921617,"lon":0.21293,"alt":56.29,"comment":"Le chêne pédonculé se distingue par ses glands portés par un long pédoncule (contrairement au chêne sessile, dont les glands sont collés aux rameaux). Ses feuilles ont un pétiole très court (presque absentes à la base) avec des oreillettes. Son tronc se creuse souvent plus tôt avec l'âge.","photo":"photos/omimg_20260818_091927.jpg","audio":null,"video":null,"youtube":null},{"name":"borne GR","lat":49.5909667,"lon":0.2262183,"alt":90.15,"comment":"Le sentier qui traverse Rolleville est le GR® 21, également connu sous le nom de « sentier des falaises ».  Dans cette portion, après avoir quitté Le Havre et traversé Montivilliers, le GR® 21 quitte le littoral pour s'enfoncer vers le nord à travers la campagne cauchoise et les paysages de la vallée de la Lézarde, en direction de Notre-Dame-du-Bec et d'Étretat.  ","photo":"photos/omimg_20260818_093654.jpg","audio":null,"video":null,"youtube":null},{"name":"Pommier","lat":49.5952467,"lon":0.2371733,"alt":66.4,"comment":"La pomme est reine en Normandie ! Symbole de la région, elle structure le paysage bocager et irrigue la gastronomie locale. Elle se transforme en cidre, calvados ou pommeau grâce au savoir-faire cidricole. En cuisine, elle sublime les plats salés (comme le poulet à la normande) et les desserts incontournables (tarte normande, bourdelot), incarnant à merveille l'art de vivre et la riche tradition fruitière normande.","photo":"photos/omimg_20260818_095743.jpg","audio":null,"video":null,"youtube":null},{"name":"Chataignier","lat":49.5955883,"lon":0.2404117,"alt":68.67,"comment":"Le châtaignier et le marronnier se distinguent facilement par leurs fruits et leurs feuilles :\n\nLe fruit : Le châtaignier produit la châtaigne (comestible, bogue très piquante à nombreux petits picots). Le marronnier produit le marron (toxique, bogue épaisse avec des picots espacés).\n\nLes feuilles : Le châtaignier a des feuilles simples, allongées et dentées. Le marronnier a des feuilles composées palmées (en forme de main) avec 5 à 7 folioles.","photo":"photos/omimg_20260818_100037.jpg","audio":null,"video":null,"youtube":null},{"name":"Reservoir","lat":49.58598500000001,"lon":0.246675,"alt":116.98,"comment":"La tour permet de créer une pression par gravité indispensable pour alimenter les robinets de chaque foyer sans pompage continu (10 m de hauteur = 1 bar de pression). Elle sert aussi de tampon régulateur, stockant l'eau pompée en heures creuses pour l'injecter dans le réseau lors des pics de consommation diurnes.","photo":"photos/omimg_20260818_105317.jpg","audio":null,"video":null,"youtube":null},{"name":"limite-commune","lat":49.58185387016015,"lon":0.237168124938425,"alt":0,"comment":"Les communes limitrophes de Rolleville sont au nombre de huit :\n\nÉp
