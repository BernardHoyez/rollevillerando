<script>
var wps=[{"name":"Introduction","lat":49.582983,"lon":0.213974,"alt":0,"comment":"","photo":null,"audio":"audio/introduction-audio.mp3","video":null,"youtube":null},{"name":"Aulne","lat":49.585199,"lon":0.212741,"alt":0,"comment":"L’aulne pousse presque toujours à proximité de l’eau : rivière, fossé, mare ou zone marécageuse. Même en hiver, il se reconnaît à ses petits cônes bruns qui restent accrochés aux branches, comme de minuscules pommes de pin. Ses bourgeons sont souvent violets et ses jeunes rameaux peuvent être collants. Astuce : écrasez une feuille fraîche entre les doigts : elle dégage une odeur caractéristique et le bois fraîchement coupé prend rapidement une teinte orangée.","photo":"photos/aulne.jpg","audio":null,"video":null,"youtube":null},{"name":"Aulne ","lat":49.586321,"lon":0.212046,"alt":0,"comment":"La feuille de l’aulne est facile à reconnaître : arrondie, dentée, avec une extrémité souvent échancrée, comme si on lui avait retiré le bout ! Elle reste parfois verte assez longtemps en automne. Tombées dans l’eau, ses feuilles nourrissent une foule de petits organismes et participent à la vie des rivières. Son bois, très résistant dans l’eau, était autrefois utilisé pour les pilotis, les canaux, les sabots et certains ouvrages hydrauliques.","photo":"photos/aulne.jpg","audio":null,"video":null,"youtube":null},{"name":"Aulne","lat":49.586506,"lon":0.212067,"alt":0,"comment":"L’aulne a longtemps été associé aux lieux humides, mystérieux et inquiétants. Dans les légendes européennes, ses boisements sombres passaient pour des refuges d’esprits et de créatures surnaturelles. En Irlande, l’abattage d’un aulne pouvait même être considéré comme dangereux : sa sève rougeâtre, visible lorsque le bois est coupé, était parfois interprétée comme du sang. Cette couleur lui a valu une réputation d’arbre « ensanglanté ».","photo":"photos/aulne2.jpg","audio":null,"video":null,"youtube":null},{"name":"Aulne blanc","lat":49.584721,"lon":0.213324,"alt":0,"comment":"Alnus incana \nPour distinguer l’aulne blanc de l’aulne glutineux, regardez les feuilles. Celles de l’aulne blanc sont plutôt ovales, pointues au sommet et grisâtres, avec un revers velu. Celles de l’aulne glutineux sont plus arrondies, souvent échancrées au sommet, vert foncé et brillantes. Autre indice : les jeunes rameaux de l’aulne glutineux sont souvent collants. Leurs petits « cônes » bruns persistent sur l’arbre en hiver.","photo":"photos/aulne-glutineux.jpg","audio":null,"video":null,"youtube":null},{"name":"Bambou","lat":49.586611,"lon":0.212166,"alt":0,"comment":"D'autres pieds de bambou existent plus loin sur le chemin; un commentaire vocal y est proposé.","photo":"photos/bambou.jpg","audio":null,"video":null,"youtube":null},{"name":"bambou","lat":49.584819,"lon":0.215795,"alt":0,"comment":"","photo":null,"audio":"audio/bambou-audio.mp3","video":null,"youtube":null},{"name":"Bernache du Canada","lat":49.583782,"lon":0.214284,"alt":0,"comment":"","photo":null,"audio":"audio/bernache_du_canada-audio.mp3","video":null,"youtube":"RnzzbLHqTv4"},{"name":"Bouleau blanc","lat":49.58613,"lon":0.212094,"alt":0,"comment":"Betula pendula Voila un arbre avec une écorce blanche caractéristique. Cette écorce est lisse et marquée de lenticelles horizontales. Les feuilles sont triangulaires, pointues et dentées. La fleur prend la forme d'un chaton. Le chaton mâle est pendant. Le chaton femelle est dressé. Le bouleau blanc est encore appelé bouleau verruqueux. Ceci est dû au fait que ses jeunes branches portent des verrues de résine blanchâtre.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Bouleau verruqueux (4)","lat":49.584534,"lon":0.213667,"alt":0,"comment":"Betula pendula","photo":"photos/bouleau-pleureur.jpg","audio":"audio/bouleau_verruqueux__4_-audio.mp3","video":null,"youtube":null},{"name":"charme","lat":49.583711,"lon":0.213712,"alt":0,"comment":"","photo":"photos/charme.jpg","audio":"audio/charme-audio.mp3","video":null,"youtube":null},{"name":"chataignier","lat":49.585137,"lon":0.215551,"alt":0,"comment":"Le châtaignier est un arbre généreux : fruits, bois, miel… Autrefois, ses châtaignes nourrissaient les populations rurales au point qu’on le surnommait « l’arbre à pain ». Sa bogue hérissée protège les fruits, tandis que son bois, riche en tanins, résiste bien à l’humidité. Et le « marron » comestible ? C’est simplement une grosse châtaigne !","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne","lat":49.586424,"lon":0.21204,"alt":0,"comment":"Même en hiver, le chêne se reconnaît assez facilement à ses rameaux tortueux, à ses bourgeons bruns regroupés en petits bouquets à l’extrémité des branches et surtout à ses feuilles mortes, souvent encore accrochées aux jeunes rameaux : c’est la marcescence. \nLe tronc porte généralement une écorce profondément crevassée. \nAutre indice : les petits glands tombés au sol trahissent souvent sa présence, même quand l’arbre est dénudé.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne pédonculé","lat":49.585617,"lon":0.21253,"alt":0,"comment":"Quercus robur .\nChez le chêne sessile, la base de la feuille ne présente pas d'oreillettes. Alors que chez le chêne pédonculé, il y a 2 oreillettes.","photo":"photos/chene-pedoncule2.jpg","audio":"audio/ch_ne_p_doncul_-audio.mp3","video":null,"youtube":null},{"name":"Chêne rouge d'Amérique","lat":49.583035,"lon":0.214013,"alt":0,"comment":"Le chêne rouge d’Amérique se reconnaît surtout à ses grandes feuilles profondément découpées, terminées par des lobes pointus, contrairement aux lobes arrondis de nos chênes indigènes. En automne, son feuillage devient spectaculaire, passant au rouge écarlate. Son écorce est grisâtre, parcourue de longues fissures. Les glands, assez gros, ont une cupule peu profonde. Introduit en Europe pour son bois et sa croissance rapide, il est aujourd’hui planté dans de nombreuses forêts.","photo":"photos/chene-amerique.jpg","audio":null,"video":null,"youtube":null},{"name":"Cliquer ici pour commencer","lat":49.582923,"lon":0.21397,"alt":0,"comment":"Parcours de découverte de l'Etang du Moulin Bonjour. Vous vous trouvez à l'entrée du site de l'Etang du Moulin. Un chemin a été aménagé de manière à faire le tour de l'étang. Le long de ce parcours d'un peu plus d'un kilomètre, vous allez croiser des éléments naturels. Des arbres, des plantes ou des oiseaux. Si vous souhaitez mieux les connaître, nous allons vous y aider, pas à pas. Utilisez votre téléphone mobile et autorisez la géolocalisation. Sur la carte apparaissent des épingles avec une étiquette associée. Il suffit de cliquer sur ces","photo":null,"audio":"audio/cliquer_ici_pour_commencer-audio.mp3","video":null,"youtube":null},{"name":"Cornouiller male","lat":49.58505,"lon":0.212891,"alt":0,"comment":"Si tu casses en deux une feuille de cornouiller mâle, tu peux observer une petite curiosité : en écartant doucement les deux morceaux, de fins filaments blanchâtres restent parfois tendus entre les deux parties.\n\nC’est lié à la présence de laticifères, de petits conduits contenant des substances élastiques. Ce phénomène est surtout visible lorsque la feuille est fraîche.\n\n👉 Petit test amusant pour une balade : prends une feuille bien fraîche, déchire-la transversalement, puis écarte lentement les deux morceaux. Si les petits fils apparaissent, tu as probablement affaire à un cornouiller.","photo":"photos/cornouiller.jpg","audio":null,"video":null,"youtube":null},{"name":"Cygne","lat":49.58610919225255,"lon":0.2124959389563719,"alt":0,"comment":"","photo":null,"audio":"audio/cygne-audio.mp3","video":null,"youtube":"zkqAk9iMsdg"},{"name":"Colvert","lat":49.584139,"lon":0.213822,"alt":0,"comment":"","photo":"photos/colvert_male.jpg","audio":"audio/colvert-audio.mp3","video":null,"youtube":null},{"name":"Ecorce de frêne","lat":49.586381,"lon":0.214715,"alt":0,"comment":"L'écorce chez les jeunes arbres est lisse, de couleur gris-vert. En vieillissant l'écorce se fissure et devient rugueuse et crevassée. Ses crevasses dessinent des losanges.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"erable a feuille d'obier","lat":49.583488,"lon":0.217234,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Erable champêtre","lat":49.584998,"lon":0.212921,"alt":0,"comment":"Acer campestre","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Erable sycomore","lat":49.58581,"lon":0.212368,"alt":0,"comment":"Acer pseudoplatanus","photo":null,"audio":"audio/erable_sycomore-audio.mp3","video":null,"youtube":null},{"name":"Foulque macroule","lat":49.586023,"lon":0.212542,"alt":0,"comment":"https://www.youtube.com/embed/vtiyjy_TWv4","photo":null,"audio":null,"video":null,"youtube":"52v3bEMKiQ0"},{"name":"Four à pain","lat":49.58312,"lon":0.214427,"alt":0,"comment":"À Rolleville, le vieux four à pain communal rappelle une époque où le pain était une affaire collective. Restauré et remis en activité, il accueille notamment la traditionnelle fête du pain. \nBoulangers amateurs et professionnels y rallument le feu, comme autrefois, pour cuire pains et brioches. Une belle façon de faire revivre un patrimoine rural où le four était aussi un lieu de rencontre.","photo":"photos/four-pain.jpg","audio":null,"video":null,"youtube":null},{"name":"Frêne","lat":49.586799,"lon":0.212589,"alt":0,"comment":"","photo":null,"audio":"audio/fr_ne-audio.mp3","video":null,"youtube":null},{"name":"Frene commun (2)","lat":49.583616,"lon":0.21376,"alt":0,"comment":"Voici une jeune frêne. Regardez son écorce. Elle est grise et lisse. Vous verrez plus loin de vieux frênes; Vous constaterez qu'elle a bien changé en vieillissant.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Fuligule morillon","lat":49.584375,"lon":0.213828,"alt":0,"comment":"","photo":null,"audio":"audio/fuligule_morillon-audio.mp3","video":null,"youtube":"bLXPddcTiuM"},{"name":"Gallinule","lat":49.583766,"lon":0.214523,"alt":0,"comment":"La gallinule (ou poule d'eau) se repère par son corps noir ardoisé, son bec rouge vif à pointe jaune prolongé d'une plaque frontale rouge, une fine ligne blanche sur les flancs et le dessous de sa queue blanc qu'elle agite en marchant.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Gland de chêne","lat":49.585552,"lon":0.212513,"alt":0,"comment":"","photo":null,"audio":"audio/gland_de_ch_ne-audio.mp3","video":null,"youtube":null},{"name":"hetre","lat":49.586316,"lon":0.214116,"alt":0,"comment":"Tiens voici un arbre à l'écorce lisse. Oui, c'est un hêtre. Regarde-le de loin, on dirait un pied d'éléphant. L'écorce est grise et lisse. elle est très fine. Elle présente des cicatrices. Là où il y avait une branche, il y a une cicatrice. Quand l'arbre croît, la cicatrice est étirée.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Highlands","lat":49.586534,"lon":0.213399,"alt":0,"comment":"","photo":null,"audio":"audio/highlands-audio.mp3","video":null,"youtube":"WqLglHV8PA0"},{"name":"Houx","lat":49.586858,"lon":0.213175,"alt":0,"comment":"Le houx garde ses feuilles vertes toute l’année, même au cœur de l’hiver. Ses feuilles épineuses ne sont pourtant pas toujours ainsi : sur les branches les plus hautes, elles sont souvent presque dépourvues d’épines ! Ses fruits rouges nourrissent les oiseaux, mais sont toxiques pour l’être humain. Autre curiosité : le houx est généralement dioïque, avec des pieds mâles et des pieds femelles.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"houx","lat":49.583292,"lon":0.217044,"alt":0,"comment":"","photo":null,"audio":"audio/houx-audio.mp3","video":null,"youtube":null},{"name":"L'ancienne roue du moulin","lat":49.58311457071282,"lon":0.2137450508062866,"alt":0,"comment":"Il y avait plus d'une dizaine de moulins sur la Lézarde qui étaient mûs par une roue hydraulique. De cette ancienne roue, il ne subsiste ici que l'axe.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"L'étang","lat":49.583916,"lon":0.213944,"alt":0,"comment":"","photo":"photos/etang.jpg","audio":"audio/l__tang-audio.mp3","video":null,"youtube":null},{"name":"Laurier cerise","lat":49.583846,"lon":0.215203,"alt":0,"comment":"","photo":null,"audio":"audio/laurier_cerise-audio.mp3","video":null,"youtube":null},{"name":"Le moulin","lat":49.583347,"lon":0.214219,"alt":0,"comment":"Il y avait plus d’une trentaine de moulins dans la vallée de la Lézarde, entre Notre-Dame-du-Bec et Harfleur. Une source patrimoniale locale donne même le chiffre de 31 moulins, essentiellement des moulins à blé.\n\nLa concentration était particulièrement forte à Épouville et Montivilliers. \nÀ elle seule, Épouville aurait compté 7 à 9 moulins selon les sources.\n\nEt à Rolleville, l’abbaye de Montivilliers possédait des droits sur six moulins !","photo":"photos/moulin.jpg","audio":null,"video":null,"youtube":null},{"name":"Merisier","lat":49.584305,"lon":0.214853,"alt":0,"comment":"","photo":"photos/merisier.jpg","audio":"audio/merisier-audio.mp3","video":null,"youtube":null},{"name":"Morelle","lat":49.585576,"lon":0.212471,"alt":0,"comment":"","photo":null,"audio":"audio/morelle-audio.mp3","video":null,"youtube":null},{"name":"Mouette rieuse","lat":49.584222,"lon":0.213831,"alt":0,"comment":"","photo":null,"audio":"audio/mouette_rieuse-audio.mp3","video":null,"youtube":null},{"name":"Noisetier","lat":49.586643,"lon":0.213384,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Noisetier","lat":49.585021,"lon":0.212898,"alt":0,"comment":"Le noisetier est un arbuste familier… mais plein de surprises. Ses fleurs mâles apparaissent dès l’hiver, sous forme de longs chatons pendants, tandis que ses discrètes fleurs femelles ressemblent à de minuscules pinceaux rouges. Il peut vivre plusieurs décennies et rejette vigoureusement depuis sa souche. Quant aux noisettes, elles nourrissent écureuils, geais… et humains ! Un vrai garde-manger forestier.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Noisetier","lat":49.586243,"lon":0.21208,"alt":0,"comment":"","photo":"photos/noisetier.jpg","audio":"audio/noisetier-audio.mp3","video":null,"youtube":null},{"name":"Noisetier fleur mâle","lat":49.585693,"lon":0.212423,"alt":0,"comment":"La fleur mâle du noisetier appelée châton. La fleur mâle, appelé chaton, se développe dès le mois de juin jusqu'à l'automne avant de rentrer en dormance jusqu'à la floraison entre mi-décembre et mars. Les chatons se déploient tout en longueur sur 5 à 10 cm en laissant leurs écailles jaunes s'ouvrir.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Noyer","lat":49.586942,"lon":0.212965,"alt":0,"comment":"Voici le noyer. Ou Juglans regia. Cet arbre se trouve dans le jardin de ce particulier. Mais vous pouvez toucher ses feuilles et ramasser ses noix sur le domaine public. Il possède de grandes feuilles composées de 5 à 9 folioles ovales. L'écorce est grise et lisse chez le jeune noyer. Elle se fissure avec l(âge.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Ormeau","lat":49.585344,"lon":0.212651,"alt":0,"comment":"","photo":"photos/orme.jpg","audio":"audio/ormeau-audio.mp3","video":null,"youtube":null},{"name":"Ormes","lat":49.585503,"lon":0.212519,"alt":0,"comment":"","photo":"photos/orme.jpg","audio":null,"video":null,"youtube":null},{"name":"Saule","lat":49.583388,"lon":0.214879,"alt":0,"comment":"Le saule se reconnaît souvent à ses feuilles étroites, allongées et généralement pointues, à leur face supérieure vert tendre et à leur revers parfois argenté. Ses rameaux sont souples, souvent colorés de jaune ou de rouge. Il aime l’eau : on le rencontre volontiers au bord des rivières, des mares et dans les zones humides. Anecdote : ses bourgeons sont protégés par une seule écaille !","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Saule","lat":49.584876,"lon":0.21322,"alt":0,"comment":"Dans la vallée de la Lézarde, quatre saules sont particulièrement faciles à rencontrer. Le saule blanc, majestueux, borde volontiers la rivière. Le saule fragile lui ressemble, mais ses rameaux cassent au moindre effort. Le saule cendré préfère les zones marécageuses. Quant au saule marsault, plus forestier, il se reconnaît au printemps à ses gros chatons argentés, surnommés « chatons de saule ».","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Saule pleureur","lat":49.583067,"lon":0.214011,"alt":0,"comment":"","photo":"photos/saule.jpg","audio":"audio/saule_pleureur-audio.mp3","video":null,"youtube":null},{"name":"Source","lat":49.58382,"lon":0.215281,"alt":0,"comment":"","photo":null,"audio":"audio/source-audio.mp3","video":null,"youtube":null},{"name":"Sureau","lat":49.585522,"lon":0.215292,"alt":0,"comment":"Le sureau, c'est l'arbuste champion du déguisement. Pour ne pas le confondre avec un cousin toxique, voici sa carte d'identité : Les feuilles : Elles sont découpées en 5 ou 7 petites \"sub-feuilles\" et dégagent une odeur fort désagréable quand on les frotte. Les fleurs : Au printemps, ce sont de grands parasols plats de mini-fleurs blanches qui sentent la vanille. Les fruits : En fin d'été, ces parasols deviennent de lourdes grappes de baies noires qui pendent vers le bas.","photo":null,"audio":"audio/sureau-audio.mp3","video":null,"youtube":null},{"name":"Sureau","lat":49.586949,"lon":0.213213,"alt":0,"comment":"Le sureau noir est une espèce d'arbuste fruitier, à feuilles caduques. Quand on casse de jeunes rameaux, on peut voir au coeur la moêlle, une substance blanche et spongieuse. Le bois est protégé par une écorce gris vert, très fissurée. La feuille est composée de 5 à 7 folioles pointues et à bord denté. Quand on frotte les feuilles, elles émettent une odeur déplaisante. Les fleurs blanches sont disposées en ombelle et elles apparaissent au début de l'été. Les fruits sont de petites baies noir violacé disposées en grappe. Les fleurs comm","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Troène","lat":49.586778,"lon":0.212409,"alt":0,"comment":"","photo":null,"audio":"audio/tro_ne-audio.mp3","video":null,"youtube":null},{"name":"Tronc de saule","lat":49.583688,"lon":0.213869,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Vieux frêne","lat":49.58691,"lon":0.213124,"alt":0,"comment":"Comparez l'écorce de ce vieux frêne avec celle du jeune frêne. Celle-ci s'est craquelée. Les lames d'écorce forment des losanges. Le vieux frêne, c'est le pépé colosse des forêts. Pour repérer ce vétéran, cherche ces indices : * **L'écorce :** Jeune, elle est lisse. Vieux, le frêne se ride complètement avec de profondes crevasses formant des losanges. * **Les bourgeons :** En hiver, c'est facile ! Il a des bourgeons d'un noir charbon unique. * **Les fruits :** En automne, il porte de grosses touffes d'hélicoptères (\"les samares\") qui restent accrochées tout l'hiver sur son houppier très aéré.","photo":null,"audio":"audio/vieux_fr_ne-audio.mp3","video":null,"youtube":null},{"name":"Yucca","lat":49.586567,"lon":0.212115,"alt":0,"comment":"Le yucca, c'est le hérisson géant du salon ou du jardin. Impossible de le rater : Les feuilles : De vraies dagues vert vif, raides, hyper pointues et disposées en pompon rigide. Attention aux yeux, il pique pour de vrai ! Le tronc : Un gros stipe de bois bien sec qui ressemble à une patte d'éléphant. La fleur : En plein milieu, il sort parfois un mât géant couvert de clochettes blanches spectaculaires. Un look de plante préhistorique increvable !","photo":"photos/yucca.jpg","audio":"audio/yucca-audio.mp3","video":null,"youtube":null},{"name":"Arrivée","lat":49.582932,"lon":0.21398,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null}];

function dl(b64,name,mime){var a=document.createElement('a');a.href='data:'+mime+';base64,'+b64;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);}
function om(src){document.getElementById('mi').src=src;document.getElementById('modal').classList.add('open');}
function cm(e){if(!e||e.target===document.getElementById('modal')||e.target===document.getElementById('mx'))document.getElementById('modal').classList.remove('open');}
