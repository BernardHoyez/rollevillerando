var wps=[{"name":"Introduction","lat":49.582983,"lon":0.213974,"alt":0,"comment":"","photo":null,"audio":"audio/introduction-audio.mp3","video":null,"youtube":null},{"name":"Aulne 2004 (7)","lat":49.585199,"lon":0.212741,"alt":0,"comment":"","photo":"photos/aulne.jpg","audio":null,"video":null,"youtube":null},{"name":"Aulne 2009 (12)","lat":49.586321,"lon":0.212046,"alt":0,"comment":"","photo":"photos/aulne.jpg","audio":null,"video":null,"youtube":null},{"name":"Aulne 2011 (14)","lat":49.586506,"lon":0.212067,"alt":0,"comment":"","photo":"photos/aulne2.jpg","audio":null,"video":null,"youtube":null},{"name":"Aulne blanc","lat":49.584721,"lon":0.213324,"alt":0,"comment":"Alnus incana }","photo":"photos/aulne-glutineux.jpg","audio":null,"video":null,"youtube":null},{"name":"Bambou","lat":49.586611,"lon":0.212166,"alt":0,"comment":"D'autres pieds de bambou existent plus loin sur le chemin; un commentaire vocal y est proposé.","photo":"photos/bambou.jpg","audio":null,"video":null,"youtube":null},{"name":"bambou","lat":49.584819,"lon":0.215795,"alt":0,"comment":"","photo":null,"audio":"audio/bambou-audio.mp3","video":null,"youtube":null},{"name":"Bernache du Canada","lat":49.583782,"lon":0.214284,"alt":0,"comment":"","photo":null,"audio":"audio/bernache_du_canada-audio.mp3","video":null,"youtube":"RnzzbLHqTv4"},{"name":"Bouleau blanc","lat":49.58613,"lon":0.212094,"alt":0,"comment":"Betula pendula Voila un arbre avec une écorce blanche caractéristique. Cette écorce est lisse et marquée de lenticelles horizontales. Les feuilles sont triangulaires, pointues et dentées. La fleur prend la forme d'un chaton. Le chaton mâle est pendant. Le chaton femelle est dressé. Le bouleau blanc est encore appelé bouleau verruqueux. Ceci est dû au fait que ses jeunes branches portent des verrues de résine blanchâtre.","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Bouleau verruqueux (4)","lat":49.584534,"lon":0.213667,"alt":0,"comment":"Betula pendula","photo":"photos/bouleau-pleureur.jpg","audio":"audio/bouleau_verruqueux__4_-audio.mp3","video":null,"youtube":null},{"name":"charme","lat":49.583711,"lon":0.213712,"alt":0,"comment":"","photo":"photos/charme.jpg","audio":"audio/charme-audio.mp3","video":null,"youtube":null},{"name":"chataignier","lat":49.585137,"lon":0.215551,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne 2010 (13)","lat":49.586424,"lon":0.21204,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Chêne pédonculé","lat":49.585617,"lon":0.21253,"alt":0,"comment":"Quercus robur Chez le chêne sessile, la base de la feuille ne présente pas d'oreillettes. Alors que chez le chêne pédonculé, il y a 2 oreillettes.","photo":"photos/chene-pedoncule2.jpg","audio":"audio/ch_ne_p_doncul_-audio.mp3","video":null,"youtube":null},{"name":"Chêne rouge d'Amérique (1)","lat":49.583035,"lon":0.214013,"alt":0,"comment":"","photo":"photos/chene-amerique.jpg","audio":null,"video":null,"youtube":null},{"name":"Cliquer ici pour commencer","lat":49.582923,"lon":0.21397,"alt":0,"comment":"Parcours de découverte de l'Etang du Moulin Bonjour. Vous vous trouvez à l'entrée du site de l'Etang du Moulin. Un chemin a été aménagé de manière à faire le tour de l'étang. Le long de ce parcours d'un peu plus d'un kilomètre, vous allez croiser des éléments naturels. Des arbres, des plantes ou des oiseaux. Si vous souhaitez mieux les connaître, nous allons vous y aider, pas à pas. Utilisez votre téléphone mobile et autorisez la géolocalisation. Sur la carte apparaissent des épingles avec une étiquette associée. Il suffit de cliquer sur ces","photo":null,"audio":"audio/cliquer_ici_pour_commencer-audio.mp3","video":null,"youtube":null},{"name":"Cornouiller male","lat":49.58505,"lon":0.212891,"alt":0,"comment":"","photo":"photos/cornouiller.jpg","audio":null,"video":null,"youtube":null},{"name":"Cygne","lat":49.58610919225255,"lon":0.2124959389563719,"alt":0,"comment":"","photo":null,"aud o":null,"youtube":null},{"name":"Saule","lat":49.584876,"lon":0.21322,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Saule pleureur","lat":49.583067,"lon":0.214011,"alt":0,"comment":"","photo":"photos/saule.jpg","audio":"audio/saule_pleureur-audio.mp3","video":null,"youtube":null},{"name":"Source","lat":49.58382,"lon":0.215281,"alt":0,"comment":"","photo":null,"audio":"audio/source-audio.mp3","video":null,"youtube":null},{"name":"Sureau","lat":49.585522,"lon":0.215292,"alt":0,"comment":"Le sureau, c'est l'arbuste champion du déguisement. Pour ne pas le confondre avec un cousin toxique, voici sa carte d'identité : Les feuilles : Elles sont découpées en 5 ou 7 petites \"sub-feuilles\" et dégagent une odeur fort désagréable quand on les frotte. Les fleurs : Au printemps, ce sont de grands parasols plats de mini-fleurs blanches qui sentent la vanille. Les fruits : En fin d'été, ces parasols deviennent de lourdes grappes de baies noires qui pendent vers le bas.","photo":null,"audio":"audio/sureau-audio.mp3","video":null,"youtube":null},{"name":"Sureau","lat":49.586949,"lon":0.213213,"alt":0,"comment":"Le sureau noir est une espèce d'arbuste fruitier, à feuilles caduques. Quand on casse de jeunes rameaux, on peut voir au coeur la moêlle, une substance blanche et spongieuse. Le bois est protégé par une écorce gris vert, très fissurée. La feuille est composée de 5 à 7 folioles pointues et à bord denté. Quand on frotte les feuilles, elles émettent une odeur déplaisante. Les fleurs blanches sont disposées en ombelle et elles apparaissent au début de l'été. Les fruits sont de petites baies noir violacé disposées en grappe. Les fleurs comm","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Troène","lat":49.586778,"lon":0.212409,"alt":0,"comment":"","photo":null,"audio":"audio/tro_ne-audio.mp3","video":null,"youtube":null},{"name":"Tronc de saule","lat":49.583688,"lon":0.213869,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Vieux frêne","lat":49.58691,"lon":0.213124,"alt":0,"comment":"Comparez l'écorce de ce vieux frêne avec celle du jeune frêne. Celle-ci s'est craquelée. Les lames d'écorce forment des losanges. Le vieux frêne, c'est le pépé colosse des forêts. Pour repérer ce vétéran, cherche ces indices : * **L'écorce :** Jeune, elle est lisse. Vieux, le frêne se ride complètement avec de profondes crevasses formant des losanges. * **Les bourgeons :** En hiver, c'est facile ! Il a des bourgeons d'un noir charbon unique. * **Les fruits :** En automne, il porte de grosses touffes d'hélicoptères (\"les samares\") qui restent accrochées tout l'hiver sur son houppier très aéré.","photo":null,"audio":"audio/vieux_fr_ne-audio.mp3","video":null,"youtube":null},{"name":"Yucca","lat":49.586567,"lon":0.212115,"alt":0,"comment":"Le yucca, c'est le hérisson géant du salon ou du jardin. Impossible de le rater : Les feuilles : De vraies dagues vert vif, raides, hyper pointues et disposées en pompon rigide. Attention aux yeux, il pique pour de vrai ! Le tronc : Un gros stipe de bois bien sec qui ressemble à une patte d'éléphant. La fleur : En plein milieu, il sort parfois un mât géant couvert de clochettes blanches spectaculaires. Un look de plante préhistorique increvable !","photo":"photos/yucca.jpg","audio":"audio/yucca-audio.mp3","video":null,"youtube":null},{"name":"Arrivée","lat":49.582932,"lon":0.21398,"alt":0,"comment":"","photo":null,"audio":null,"video":null,"youtube":null}];
