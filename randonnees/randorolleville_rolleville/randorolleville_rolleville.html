var wps=[{"name":"Départ","lat":49.5833007,"lon":0.2141791,"alt":0,"comment":"Regroupement des randonneurs autour d'un café","photo":"photos/8b0ffcfa-f8c0-45b3-829a-a9e079e19c76.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Ancien chemin de fer Le Havre Fécamp","lat":49.583366832736765,"lon":0.21539063543061235,"alt":0,"comment":"Cet ancien tracé ferroviaire témoigne d’une époque où le chemin de fer constituait un vecteur essentiel du développement économique et des échanges entre les villes littorales normandes. La ligne reliant Le Havre à Fécamp, mise en service en 1895, desservait plusieurs communes du pays de Caux, facilitant notamment le transport des voyageurs et des marchandises. Son parcours, aujourd’hui en partie reconverti en chemin de randonnée, conserve la mémoire de cette infrastructure disparue. Les talus, déblais et ouvrages d’art encore visibles permettent de lire dans le paysage les traces de cette anc","photo":"photos/acb4c129-1700-468a-acf7-c3792b8f6f2d.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Rue Petitpas","lat":49.581391304712405,"lon":0.21804808734609438,"alt":90,"comment":"","photo":null,"photoExternal":null,"audio":"audio/2026_10_04_10_33_13_1_maisons_li_es_au_chemin_de_fer.mp3","video":null,"youtube":null},{"name":"Anciennes fermes","lat":49.58043829252441,"lon":0.21900513159518467,"alt":95,"comment":"","photo":null,"photoExternal":null,"audio":"audio/2026_10_04_10_35_37_1_anciennes_fermes.mp3","video":null,"youtube":null},{"name":"sapin de Douglas (Pseudotsuga menziesii)","lat":49.5803356,"lon":0.2201795,"alt":0,"comment":"Le sapin de Douglas (Pseudotsuga menziesii), originaire d'Amérique du Nord, est un résineux majeur des forêts françaises. Introduit au XIXᵉ siècle, il se distingue par sa croissance rapide et son bois aux propriétés mécaniques exceptionnelles. Utilisé en charpente et en bardage, il résiste naturellement aux champignons après séchage. Son écorce épaisse et crevassée, tout comme ses aiguilles souples dégageant une odeur de citronnelle au froissement, le rendent facilement identifiable. Il joue un rôle économique clé dans le reboisement.","photo":"photos/966793b7-9553-4aad-b127-38d028ec8ae4.jpg","photoExternal":null,"audio":"audio/2026_10_04_10_39_31_1_vestiaires.mp3","video":null,"youtube":null},{"name":"Lotissement des chataigniers Rolleville","lat":49.581488691771,"lon":0.22067674655375852,"alt":0,"comment":"Origine du site : Le secteur tire son nom de la présence historique de boisements ou d'anciens vergers et châtaigneraies qui bordaient les coteaux du plateau cauchois.\n\nPhase d'aménagement : Dans le cadre des politiques d'accession à la propriété individuelle (favorisées par l'extension du réseau routier et la périurbanisation des années 1970–1990), ces parcelles agricoles et naturelles sont ouvertes à l'urbanisation.\n\nTypologie bâti : Le lotissement adopte le modèle pavillonnaire typique de cette époque : des maisons individuelles implantées au centre de parcelles closes.","photo":"photos/b5d7f91e-8a30-4957-8b8b-139dcb6776f1.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Herbe de la Pampa","lat":49.5821329,"lon":0.2196418,"alt":0,"comment":"L'herbe de la Pampa (Cortaderia selloana) et la renommée Renouée du Japon figurent parmi les espèces exotiques envahissantes les plus redoutables. Comme la Renouée, l'herbe de la Pampa colonise agressivement les milieux, étouffe la flore locale et appauvrit la biodiversité. Si la Renouée prolifère par ses rhizomes souterrains, l'herbe de la Pampa se disperse par le vent grâce aux milliers de graines produites par ses plumeaux. Désormais interdite à la vente et au transport en France, son éradication exige un arrachage méticuleux avant floraison.   ","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Ancienne Gare","lat":49.5817378,"lon":0.2154761,"alt":0,"comment":"L'ancienne gare de Rolleville, inaugurée en 1896 sur la ligne Le Havre-Graville à Tourville-les-Ifs, témoigne de l'essor ferroviaire de la vallée de la Lézarde au tournant du XXᵉ siècle. Terminus historique du service suburbain de l'agglomération havraise, le site a vu circuler ses derniers trains en septembre 2024. Si les voies sont aujourd'hui désaffectées dans l'attente des mutations de la mobilité régionale, l'ancien bâtiment voyageurs d'origine en briques a été reconverti en groupe scolaire, préservant ainsi le patrimoine bâti et la mémoire ferroviaire de la commune.","photo":"photos/6a00889e-ff97-44fa-a0bd-fc09540afa89.jpg","photoExternal":null,"audio":"audio/2026_10_04_10_54_07_1_gare_rolleville.mp3","video":null,"youtube":null},{"name":"L'école","lat":49.5807997,"lon":0.2160247,"alt":0,"comment":"Inauguré en 2023, le nouveau groupe scolaire de Rolleville s'inscrit au cœur du patrimoine de la commune en investissant l'ancienne gare de la vallée de la Lézarde. Ce projet d'aménagement réhabilite le bâtiment voyageurs historique en briques tout en lui adossant une extension contemporaine, moderne et durable. Conçue pour offrir des espaces d'apprentissage lumineux et fonctionnels, l'école regroupe désormais les classes maternelles et élémentaires. Elle illustre une reconversion réussie du patrimoine ferroviaire au service de la vie locale.","photo":"photos/447a6f35-5ee6-4cb0-ae86-1f9cc18fd992.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_02_25_1_arbres__cole.mp3","video":null,"youtube":null},{"name":"Passerelle sur la Lézarde","lat":49.5815345,"lon":0.2137402,"alt":0,"comment":"La Lézarde, rivière côtière emblématique de la Seine-Maritime, façonne profondément la géographie et le paysage de Rolleville. Traversant la commune du nord au sud, ce cours d'eau a historiquement structuré le développement local, alimentant d'anciens moulins et irriguant les fonds de vallée. Aujourd'hui, la rivière et ses berges constituent un corridor écologique majeur pour la faune et la flore aquatiques du Pays de Caux. Menacée par le ruissellement, La Lézarde fait l'objet de démarches de préservation pour restaurer sa continuité écologique.","photo":"photos/2be944e9-ef58-4354-b107-51915d6f77f3.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_04_34_1_prairie_inondable.mp3","video":null,"youtube":null},{"name":"Repère","lat":49.58159129578316,"lon":0.21326732134509643,"alt":0,"comment":"","photo":null,"photoExternal":null,"audio":"audio/2026_10_04_11_08_51_1_coupe_de_la_prairie.mp3","video":null,"youtube":null},{"name":"Future construction","lat":49.58141391243975,"lon":0.21381702446663825,"alt":83,"comment":"","photo":null,"photoExternal":null,"audio":"audio/2026_10_04_11_10_28_1_logements.mp3","video":null,"youtube":null},{"name":"Chapelle Sainte Clothilde","lat":49.58167303102829,"lon":0.21313057496443744,"alt":0,"comment":"Édifiée au-dessus d'une source autrefois vénérée, la chapelle Sainte-Clotilde de Rolleville témoigne de la dévotion populaire normande, attestée dès le XVIIᵉ siècle. Pendant plusieurs siècles et jusque dans les années 1950, le site attirait de nombreux pèlerins venus chercher la guérison de leurs maux, notamment les affections cutanées, en s'humectant de cette eau réputée miraculeuse. Ce modeste édifice en briques, niché dans la verdure, conserve la mémoire de ces rituels thérapeutiques sacrés, constituant une halte patrimoniale emblématique de la vallée.","photo":"photos/776e3b4f-e0e7-4c46-87f8-a9d6097d7227.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_18_49_1_fontaine_ste_clotilde.mp3","video":null,"youtube":null},{"name":"Statue de Sainte Clothilde","lat":49.5818374,"lon":0.2129855,"alt":0,"comment":"La statue représente sainte Clotilde (v. 474–545), reine des Francs et épouse de Clovis.Elle est reconnaissable à ses attributs traditionnels :La couronne royale : rappelant son rang de reine des Francs.La maquette d'église ou de chapelle : portée dans sa main, elle symbolise son rôle de fondatrice d'édifices religieux et son action majeure dans la conversion de Clovis au christianisme.","photo":"photos/489fd828-bbea-4372-83ad-a607d0566841.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_23_32_1_statue_ste_clotilde.mp3","video":null,"youtube":null},{"name":"Statue de Sainte Clothilde","lat":49.5818374,"lon":0.2129855,"alt":0,"comment":"Ancré autour d'une source réputée guérisseuse, le pèlerinage à Sainte-Clotilde de Rolleville remonte à plusieurs siècles. Chaque 3 juin, jour de la sainte, les pèlerins du Pays de Caux et du Havre s'y rassemblaient pour soigner maux de peau et affections oculaires grâce aux vertus attribuées à l'eau. L'érection de la chapelle-fontaine à la fin du XIXᵉ siècle a structuré ces dévotions rituelles. Bien que tombé en désuétude au milieu du XXᵉ siècle face aux progrès de la médecine, ce site reste un haut lieu de la mémoire et du patrimoine local.","photo":"photos/52caadf9-e3a5-4674-a4fe-cb7daabfb443.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"L'église","lat":49.5821088,"lon":0.212436,"alt":0,"comment":"Édifiée au XIᵉ siècle puis remaniée aux XVIᵉ et XIXᵉ siècles, l'église Saint-Hilaire de Rolleville se distingue par son chœur roman remarquable et son clocher à charpente d'inspiration cauchoise. Longtemps au cœur des dévotions locales, l'édifice conservait une statuaire variée ainsi que des liens étroits avec la source Sainte-Clotilde toute proche. Sa proximité avec la Lézarde en faisait le point de ralliement des processions paroissiales. Malgré les destructions partielles et les rénovations, elle demeure l'un des plus anciens éléments du patrimoine bâti de la commune.","photo":"photos/b6bf53cb-49ea-417d-a1cc-d9b6624af811.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_29_28_1_porche__glise.mp3","video":null,"youtube":null},{"name":"Repère","lat":49.5814702,"lon":0.2122675,"alt":0,"comment":"","photo":null,"photoExternal":null,"audio":"audio/2026_10_04_11_33_29_1_mairie_presbyt_re.mp3","video":null,"youtube":null},{"name":"Le manoir des Abbesses","lat":49.58138569999999,"lon":0.2123239,"alt":0,"comment":"Le Manoir des Abbesses à Rolleville témoigne de l'empreinte monastique dans la vallée de la Lézarde sous l'Ancien Régime. Lié à l'abbaye de Montivilliers, ce domaine servait de résidence seigneuriale et de centre de perception des dîmes pour les religieuses. Son architecture cauchoise traditionnelle mêle harmonieusement silex, brique et pan de bois, reflétant la prospérité agricole du Pays de Caux. Épargné par les mutations industrielles du secteur, ce remarquable ensemble patrimonial privé conserve aujourd'hui toute sa valeur mémorielle et paysagère.","photo":"photos/1b55a4c2-7dac-4dc4-9203-b2c59ae456ad.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_37_02_1_manoir.mp3","video":null,"youtube":null},{"name":"La cour du manoir","lat":49.5812067,"lon":0.2120701,"alt":0,"comment":"Le Manoir des Abbesses à Rolleville servait principalement de résidence de villégiature et de centre de gestion domaniale pour les moniales de la prestigieuse abbaye de Montivilliers. Au XVIᵉ siècle, l'abbesse Guillemette de La Platière y établit une maison de campagne pour s'éloigner de la rigueur monastique. Idéalement situé dans la vallée de la Lézarde, ce domaine permettait aussi aux religieuses d'administrer leurs terres agricoles, de percevoir la dîme et d'affirmer leur autorité seigneuriale sur la paroisse.","photo":"photos/5b104413-8b49-49d5-830c-10ef644358c5.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Le Petit Manoir","lat":49.5811255,"lon":0.2098233,"alt":0,"comment":"","photo":"photos/f4a0d2f5-8b92-47c3-b67a-2d609647e0f1.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_43_25_1_petit_manoir.mp3","video":null,"youtube":null},{"name":"L'ancienne école","lat":49.581482,"lon":0.2101509,"alt":0,"comment":"L'ancienne école communale de Rolleville, édifiée en briques au début du XXᵉ siècle, a longtemps vibré au rythme des générations d'écoliers du village. Remplacée par le nouveau groupe scolaire aménagé dans l'ancienne gare, la bâtisse n'a pas perdu sa vocation d'accueil. Métamorphosée après une ambitieuse rénovation patrimoniale, elle a été reconvertie en chambre d'hôtes. Ce changement d'usage réussit le pari de préserver l'architecture républicaine d'origine tout en offrant une halte chaleureuse aux touristes et randonneurs de la vallée.","photo":"photos/e928086c-c819-41f5-bde1-2f1c7e1537dd.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_44_56_1_ecole_blockhaus.mp3","video":null,"youtube":null},{"name":"En chemin","lat":49.5830136,"lon":0.2097479,"alt":0,"comment":"La rue principale du village porte le nom de Charles Barbanchon en hommage à cet ancien maire de Rolleville, qui a dirigé la commune au sortir de la Seconde Guerre mondiale, de 1945 à 1958.   Il s'agit d'une pratique courante pour honorer la mémoire de l'édile qui a accompagné le village durant la période cruciale de la Reconstruction et du développement d'après-guerre. ","photo":"photos/b8221e55-343a-4d0f-bce8-e8461f9149be.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_48_50_1_parking_ancienne_ecole.mp3","video":null,"youtube":null},{"name":"Abélia à grandes fleurs","lat":49.58392140000001,"lon":0.2090294,"alt":0,"comment":"La haie d'Abélia à grandes fleurs (Abelia x grandiflora) séduit par sa longue floraison estivale et automnale. De juillet aux gelées, ses clochettes parfumées, blanches à rose pâle, attirent abeilles et papillons. Son feuillage dense, vert luisant et semi-persistant, prend de belles nuances pourpres à l'automne tout en offrant une protection visuelle agréable. Facile d'entretien, rustique et tolérant bien la taille, cet arbuste mellifère s'adapte à tous les sols drainés et supporte la sécheresse une fois bien installé au soleil.","photo":"photos/8f7caea0-1563-4e5f-8f81-055771524364.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Lotissement","lat":49.5843631,"lon":0.209437,"alt":0,"comment":"","photo":"photos/83727a96-9057-4d7b-bb33-280e061dbf33.jpg","photoExternal":null,"audio":"audio/2026_10_04_11_59_41_1_lotissement_ex_jean_vanier.mp3","video":null,"youtube":null},{"name":"Entrée du Parc du Moulin","lat":49.5867567,"lon":0.2121683,"alt":0,"comment":"Le parc du Moulin, à Rolleville, s’inscrit dans un paysage façonné par la présence de l’eau et l’histoire rurale de la vallée de la Lézarde. Cet espace de verdure évoque l’importance des moulins, autrefois nombreux dans les campagnes normandes, où l’énergie hydraulique permettait notamment de moudre les céréales. La proximité du cours d’eau, la végétation des berges et les perspectives paysagères composent un environnement propice à la promenade. Au-delà de son agrément, ce parc rappelle combien les activités humaines ont longtemps entretenu une relation étroite avec les ressources naturelles ","photo":"photos/c50d02f5-8684-4631-8663-d2a342921610.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Etang du Moulin","lat":49.5856444,"lon":0.2124977,"alt":0,"comment":"Nés du creusement des ballastières au XXᵉ siècle et de l'aménagement des anciens biefs de moulins, les étangs de la vallée de la Lézarde, entre Rolleville et Épouville, sont le fruit du travail humain. Alimentées par la nappe phréatique et la rivière, ces anciennes carrières de granulats ont été reconverties en un vaste corridor écologique. Aujourd'hui, ce réseau de plans d'eau constitue une zone humide protégée essentielle pour la biodiversité, tout en offrant aux pêcheurs et promeneurs un cadre naturel préservé au cœur du Pays de Caux.","photo":"photos/5a9b42d7-e4ee-456a-9ffe-98b42f4d8851.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Le Moulin","lat":49.58327600000001,"lon":0.2142353,"alt":0,"comment":"La vallée de la Lézarde fut longtemps un important centre de meunerie, grâce à la force motrice de ses eaux. Au Moyen Âge, six moulins sont attestés à Rolleville, sous le contrôle de l’abbaye de Montivilliers. Ils servaient principalement à moudre le grain, mais aussi à transformer d’autres matières. Parmi les établissements connus figure le moulin de Baude, datant du XVIIe siècle, dont le nom provient de l’ancien cauchois baödes, signifiant « moulin des braves ». Le moulin Alleaume, également appelé moulin de Rolleville, fut successivement moulin à blé, brûlerie de café puis laiterie. ","photo":"photos/dce9714f-dd9d-49c4-bda3-f882cb674821.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null}];
