var wps=[{"name":"Départ","lat":49.5825933,"lon":0.2143667,"alt":42.51,"comment":"Champ de foire Grande randonnée Heure de départ: 09:02 25 août 2026 Heure d'arrivée: 11:35 25 août 2026 Distance: 11,1km Temps déplacement: 02:18 Vitesse moyenne: 4,33 km/h Vitesse en mouvement: 4,82 km/h Vitesse Max.: 6,69 km/h Altitude minimale: 35 m Altitude maximale: 108 m Vitesse de montée: 127,9 m/h Vitesse de descente: 127,4 m/h Dénivelé positif: 131 m Dénivelé négatif: 123 m Temps de montée: 01:01 Temps de descente: 00:58","photo":null,"audio":null,"video":null,"youtube":null},{"name":"Vaches","lat":49.6043167,"lon":0.1963633,"alt":55.5,"comment":"Elles ont levé la tête juste à temps pour entrer dans la photo. Avec leur robe blanche constellée de taches rousses ou noires, les vaches normandes semblent porter les couleurs du bocage : le vert des prairies, le brun des chemins, le blanc des nuages. Paisibles et curieuses, elles observent les randonneurs avec ce mélange de placidité et de méfiance propre aux grandes habitantes des prés. Ici, pas besoin de chercher un monument : le paysage a quatre pattes, rumine tranquillement et vous regarde passer.","photo":"photos/omimg_20260825_095338.jpg","audio":null,"video":null,"youtube":null},{"name":"Résidence","lat":49.60454669999999,"lon":0.1869267,"alt":62.18,"comment":"","photo":"photos/omimg_20260825_100747.jpg","audio":null,"video":null,"youtube":null},{"name":"Chateau de la Marguerite","lat":49.60446830000001,"lon":0.18515,"alt":65.14,"comment":"Le château de la Marguerite se trouve à Saint-Jouin-Bruneval, dans le département de la Seine-Maritime, en Normandie.\n\nÉlevé sur l'emplacement d'une ancienne léproserie (la maladrerie de Sainte-Marguerite), ce site historique date en grande partie de la fin du XVIe et du début du XVIIe siècle. Il conserve notamment des éléments architecturaux remarquables en pierre et silex, tels qu'un colombier circulaire et une porte charretière monumentale.","photo":"photos/omimg_20260825_100935.jpg","audio":null,"video":null,"youtube":null},{"name":"Ferme","lat":49.608975,"lon":0.179145,"alt":81.53,"comment":"Le clos-masure incarne la ferme cauchoise par excellence. Cette cour carrée, plantée de pommiers et creusée d'une mare, est ceinte d'un haut talus planté de hêtres formant un brise-vent naturel. Les bâtiments (habitation, granges, colombier) y sont disséminés pour parer aux incendies. L'architecture associe subtilement brique rouge, silex taillé et pans de bois, autrefois coiffés de chaume. Véritables oasis de verdure sur le plateau, ces exploitations autonomes structurent tout le paysage du Pays de Caux.","photo":"photos/omimg_20260825_102508.jpg","audio":null,"video":null,"youtube":null},{"name":"Mannevillette","lat":49.6090733,"lon":0.1755417,"alt":82.44,"comment":"Niché sur le plateau cauchois en Seine-Maritime, Mannevillette tire son nom du latin Magna Villa (le grand domaine), mentionné dès le XIe siècle. Géographiquement, ce village rural culmine à environ 95 mètres d'altitude près de l'estuaire de la Seine, à l'est du Havre. Marqué par une illustre tradition agricole et l'empreinte de ses seigneurs, il abrite un patrimoine remarquable, à l'image de son église romane du XIIe siècle.","photo":"photos/omimg_20260825_103250.jpg","audio":null,"video":null,"youtube":null},{"name":"Clocher","lat":49.5974083,"lon":0.1760367,"alt":90.16,"comment":"L'église Notre-Dame-de-l'Assomption de Mannevillette se distingue par une singularité architecturale rare. Entièrement reconstruite en briques en 1888, elle a vu son axe d'orientation originel totalement détourné vers le nord. De ce fait, l'ancienne tour-clocher ne s'intercale plus entre la nef et le chœur, mais fait désormais office de porche d'entrée. Ce remaniement de fin de siècle offre au cœur du village cauchois un édifice atypique aux lignes géométriques inattendues.","photo":"photos/omimg_20260825_105103.jpg","audio":null,"video":null,"youtube":null},{"name":"Silo en ruines","lat":49.5917933,"lon":0.187985,"alt":104.53,"comment":"Les silos à grains sont des structures indispensables à l'agriculture. Leur rôle principal est de stocker les récoltes en les protégeant de l'humidité, des moisissures et des nuisibles. Ils permettent de réguler l'approvisionnement des marchés toute l'année. Grâce à des systèmes de ventilation, ils évitent la fermentation des céréales et facilitent leur transfert vers les industries agroalimentaires ou les ports d'exportation.","photo":"photos/omimg_20260825_110521.jpg","audio":null,"video":null,"youtube":null},{"name":"Arrivée","lat":49.5823633,"lon":0.2113533,"alt":53.34,"comment":"Grande randonnée Heure de départ: 09:02 25 août 2026 Heure d'arrivée: 11:35 25 août 2026 Distance: 11,1km Temps déplacement: 02:18 Vitesse moyenne: 4,33 km/h Vitesse en mouvement: 4,82 km/h Vitesse Max.: 6,69 km/h Altitude minimale: 35 m Altitude maximale: 108 m Vitesse de montée: 127,9 m/h Vitesse de descente: 127,4 m/h Dénivelé positif: 131 m Dénivelé négatif: 123 m Temps de montée: 01:01 Temps de descente: 00:58","photo":null,"audio":null,"video":null,"youtube":null}];
