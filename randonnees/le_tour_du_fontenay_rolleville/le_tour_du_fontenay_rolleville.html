var wps=[{"name":"Départ","lat":49.582546024467355,"lon":0.21445613051408244,"alt":86,"comment":"Le nom de la commune trouve son origine dans le latin fontana, qui fait référence à l'abondance des sources et des fontaines présentes sur le territoire. D'ailleurs, la devise historique de la commune illustre bien cet attachement : « La source coule toujours ». Les plus anciennes mentions écrites du village remontent aux environs de 1210 sous des formes latinisées telles que Fontenei.","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Chevaux Vallon de Nerval","lat":49.5630332,"lon":0.1987716,"alt":0,"comment":"Le Fond de Nerval est bien identifié à Fontenay et constitue un site naturel répertorié en ZNIEFF de type I, notamment pour ses prairies et sa chênaie.","photo":"photos/439c69a6-76d4-47a9-97d0-128205d62e20.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"La Clinarderie","lat":49.5566793,"lon":0.1929873,"alt":0,"comment":"Le toponyme Clinarderie est anciennement implanté dans ce secteur, comme l’attestent encore le hameau, le chemin et le Fonds de la Clinarderie. Depuis le vallon de Nerval, cette étape permet ainsi de retrouver un paysage rural qui a progressivement été gagné par l’urbanisation montivillonnaise.","photo":"photos/3bed43b9-4b9f-45aa-b680-a058fae691ef.jpg","photoExternal":null,"audio":null,"video":null,"youtube":null},{"name":"Arrivée","lat":49.58283817814597,"lon":0.21418800035592603,"alt":83,"comment":"Sous l'Ancien Régime et surtout au cours du XIXe et du début du XXe siècle, les \"champs de foire\" étaient des espaces ouverts aménagés à l'extérieur ou en marge du bourg principal. Ils servaient de lieux de rassemblement périodiques.","photo":null,"photoExternal":null,"audio":null,"video":null,"youtube":null}];
