<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0e2"/>
      <stop offset="100%" stop-color="#cdd9b8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fae7a"/>
      <stop offset="100%" stop-color="#5c7a4e"/>
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>

  <!-- colline -->
  <path d="M0 300 Q140 240 260 290 T512 260 V512 H0 Z" fill="#a9c088"/>

  <!-- étang -->
  <path d="M0 340 Q160 300 256 340 T512 330 V512 H0 Z" fill="url(#water)"/>

  <!-- reflet -->
  <ellipse cx="330" cy="380" rx="90" ry="10" fill="#dfe8c9" opacity="0.35"/>

  <!-- roseaux -->
  <g stroke="#3f5a34" stroke-width="6" stroke-linecap="round">
    <path d="M120 400 Q118 350 130 310"/>
    <path d="M140 405 Q142 360 128 320"/>
    <path d="M158 400 Q160 365 150 330"/>
  </g>
  <g fill="#6b4a2f">
    <ellipse cx="130" cy="306" rx="6" ry="14"/>
    <ellipse cx="150" cy="326" rx="5" ry="12"/>
  </g>

  <!-- canard -->
  <g transform="translate(300,392)">
    <ellipse cx="0" cy="0" rx="58" ry="34" fill="#f4ecd8"/>
    <path d="M-30 -18 Q-10 -50 24 -34 Q34 -20 20 -6 Q0 -16 -30 -18 Z" fill="#3f6b4a"/>
    <circle cx="18" cy="-26" r="5" fill="#2b3b2c"/>
    <path d="M30 -22 L48 -18 L30 -12 Z" fill="#d98a3d"/>
  </g>
</svg>
