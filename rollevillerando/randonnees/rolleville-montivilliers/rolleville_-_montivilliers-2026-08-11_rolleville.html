var wps=[{"name":"Départ","lat":49.5816617,"lon":0.2130617,"alt":32.65,"comment":"Préparez-vous. Nous allons marcher plus de 12 kilomètres.","photo":null,"audio":null,"video":null},{"name":"Manoir des Abbesses","lat":49.5809967,"lon":0.2126533,"alt":43.15,"comment":"Au détour d'un vallon normand, le Manoir des Abbesses surgit comme un palimpseste de pierre calcaire et de silex taillé. Ce logis monastique, sentinelle silencieuse de Rolleville, dresse ses imposants pignons à redents et ses lucarnes sculptées face aux méandres de la Lézarde. Entre vestiges du passé et élégance architecturale de la Renaissance, l'œil du randonneur savoure l'harmonie austère mais lumineuse de cette ancienne dépendance ecclésiastique, figée dans sa parenterie de verdure et d'histoire.","photo":"photos/omimg_20260811_090604.jpg","audio":null,"video":null},{"name":"Arrêt de bus 21","lat":49.5779117,"lon":0.215425,"alt":34.09,"comment":"La ligne 21 va de la gare du Havre à Etretat Le Grand Val.","photo":"photos/omimg_20260811_091114.jpg","audio":null,"video":null},{"name":"Millepertuis","lat":49.577185,"lon":0.2157867,"alt":33.6,"comment":"Sous mes pas de marcheur, le millepertuis éclabousse les bas-côtés d'un jaune solaire. Jadis surnommé « chasse-diable », ce végétal garde en ses feuilles perforées les stigmates de ses légendes : selon la coutume, ses macérations purpurines soignaient les blessures des croisés. En écrasant une fleur entre mes doigts, la sève rouge sang rappelle cette pharmacopée ancestrale, transformant ce modeste arbrisseau en un précieux grimoire botanique niché au cœur de nos sentiers.","photo":"photos/omimg_20260811_091227.jpg","audio":null,"video":null},{"name":"Chemin de l'Ormerie","lat":49.57128169999999,"lon":0.220145,"alt":33.95,"comment":"Ici, le Chemin de l'Ormerie déroule son ruban de terre creusé par les siècles et la déclivité des eaux. Ce nom d'autrefois, évocation végétale d'une ormaie disparue sous les assauts de la graphiose, résonne encore entre les talus de l'andosol. L'objectif capte l'ombre portée des frondaisons sur la craaie affleurante, révélant la géologie intime du terroir. Une invitation à arpenter ce corridor botanique où la mémoire sylvestre dialogue avec l'obstination minérale des vieux chemins creux.","photo":"photos/omimg_20260811_092155.jpg","audio":null,"video":null},{"name":"Vallée de la Lézarde","lat":49.5702617,"lon":0.21749,"alt":0,"comment":"Sculptée par l'eau comme un ruban de verdure secret, la vallée de la Lézarde déroule ses paysages enchanteurs au fil du courant. Ici, le temps suspend son vol entre prairies lumineuses et sous-bois mystérieux, où chaque méandre dévoile un nouveau tableau vivant. Un véritable havre de paix où le murmure de la rivière accompagne les pas du promeneur, l'invitant à capturer en image la poésie simple et sauvage de cette nature accueillante et préservée.","photo":"photos/omimg_20260811_092525.jpg","audio":null,"video":null},{"name":"Manoir de l'Ormerie à Rolleville","lat":49.56879,"lon":0.21436,"alt":96.04,"comment":"Une ancienne demeure, le manoir de l'Ormerie","photo":"photos/omimg_20260811_093002.jpg","audio":null,"video":null},{"name":"Les deux cheminées EDF du Havre","lat":49.56811500000001,"lon":0.21206,"alt":96.82,"comment":"D'une hauteur vertigineuse, les deux cheminées EDF du Havre dominent l'estuaire comme des phares industriels anachroniques. Je me souviens de cette randonnée où, surgissant soudain au détour d'un plateau bocager, ces géants de béton m'ont rappelé l'immensité de la zone portuaire. En cadrant leur silhouette élancée face au ciel changeant de la Seine, l'image saisit ce contraste saisissant entre la rudesse de l'infrastructure énergétique et la poésie brute de l'horizon normand en fin de parcours.","photo":"photos/omimg_20260811_093514.jpg","audio":null,"video":null},{"name":"Centre équestre","lat":49.5684789,"lon":0.2079462,"alt":0,"comment":"Au seuil de ce centre équestre, mon regard croise la silhouette nerveuse d'un pur-sang, rappelant l'illustre ascendance de ces plaines d'élevage. J'aime songer aux lointaines origines équines, depuis l'Eohippus des forêts primitives jusqu'aux fiers destriers de nos manèges actuels. En capturant ce moment suspendu où l'animal hume le vent du large, le cliché immortalise cette alliance séculaire entre l'homme et le cheval, ancrant la randonnée dans le pouls vivant du terroir normand.","photo":"photos/omimg_20260811_095402.jpg","audio":null,"video":null},{"name":"Bassin de rétention","lat":49.5684789,"lon":0.2079462,"alt":0,"comment":"Ce bassin de rétention joue un rôle essentiel dans la régulation des eaux pluviales et la prévention des inondations. En stockant temporairement les précipitations excessives lors d'intempéries, il permet de restituer l'eau de manière progressive dans le milieu naturel. Cette infrastructure contribue ainsi à la protection des écosystèmes environnants et des zones habitées en aval, tout en favorisant la recharge mesurée des nappes souterraines au cœur de nos paysages aménagés.","photo":"photos/omimg_20260811_095732.jpg","audio":null,"video":null},{"name":"Maison ancienne","lat":49.5684789,"lon":0.2079462,"alt":0,"comment":"Blottie contre le temps, cette maison ancienne semble murmurer les secrets des siècles passés. Avec ses murs de briques et de silex assemblés comme un puzzle rustique et son toit de chaume ou d'ardoises doucement courbé, elle incarne l'âme intemporelle des campagnes normandes. Chaque poutre apparente et chaque fenêtre garnie de gérants fleuris racontent une histoire de famille et de traditions, offrant au regard du promeneur une escale pleine de charme et de poésie authentique.","photo":"photos/omimg_20260811_101149.jpg","audio":null,"video":null},{"name":"Charnier de Brisgaret","lat":49.5684789,"lon":0.2079462,"alt":0,"comment":"Le charnier de Brisgaret constitue un témoignage historique remarquable du patrimoine funéraire régional. Ce type de structure, destiné à abriter les ossements exhumés des cimetières paroissiaux saturés, illustre les pratiques mémorielles d'autrefois. En préservant l'architecture sobre de ce monument, le site offre aux randonneurs une halte propice à la contemplation historique et à la réflexion sur la mémoire collective et l'évolution des rites funéraires à travers les siècles.","photo":"photos/omimg_20260811_101638.jpg","audio":null,"video":null},{"name":"Sente des rivières","lat":49.5684789,"lon":0.2079462,"alt":0,"comment":"La Sente des Rivières longe le cours de la Lézarde sur le territoire de Montivilliers, constituant un axe de communication ancien. Ce cheminement met en valeur la relation historique entre le milieu urbain et les zones humides riveraines. En suivant ce sentier aménagé, le randonneur observe la diversité de la faune et de la flore aquatiques, tout en mesurant l'importance de la préservation des corridors écologiques au cœur des paysages de la vallée.","photo":"photos/omimg_20260811_102306.jpg","audio":null,"video":null},{"name":"Séneçon de Jacobée","lat":49.54723,"lon":0.1965967,"alt":22.06,"comment":"Le séneçon de Jacobée se distingue par ses inflorescences en capitules d'un jaune éclatant, visibles le long des chemins durant la saison estivale. Cette espèce végétale, commune dans les prairies et les jachères, joue un rôle écologique avéré en accueillant de nombreux insectes pollinisateurs. Toutefois, sa toxicité pour le bétail requiert une gestion attentive des pâturages environnants, illustrant l'équilibre nécessaire entre biodiversité floristique et activités agricoles locales.","photo":"photos/omimg_20260811_102411.jpg","audio":null,"video":null},{"name":"Eupatoire chanvrine","lat":49.54745,"lon":0.19702,"alt":22.86,"comment":"Surgissant des sols humides comme un feu d'artifice végétal, l'eupatoire chanvrine dresse ses délicats bouquets pourprés au bord du chemin. Ses inflorescences vaporeuses attirent une foule de papillons et d'insectes butineurs, transformant chaque touffe en un véritable îlot de vie bourdonnant. En contemplant cette élégante sauvageonne aux reflets roses, le promeneur découvre toute la poésie insoupçonnée des rivages et des fossés qui bordent discrètement nos itinéraires de randonnée.","photo":"photos/omimg_20260811_102451.jpg","audio":null,"video":null},{"name":"Eupatoire chanvrine","lat":49.54726,"lon":0.1979467,"alt":20.12,"comment":"L'eupatoire chanvrine se caractérise par ses inflorescences duveteuses aux teintes pourpres, se développant principalement dans les milieux humides et le long des cours d'eau. Cette plante vivace joue un rôle écologique primordial en fournissant une ressource mellifère essentielle pour de nombreux insectes pollinisateurs durant la période estivale. Sa présence témoigne de la richesse des zones riveraines, illustrant la nécessité de préserver ces habitats naturels fragiles le long des sentiers.","photo":"photos/omimg_20260811_102550.jpg","audio":null,"video":null},{"name":"Roselière","lat":49.54719000000001,"lon":0.1992767,"alt":0,"comment":"En longeant la Lézarde à Montivilliers, cette roselière m'a offert un véritable instant suspendu. Alors que je marquais une pause au plus près des berges, un bruissement soudain a trahi le manège discret d'une rousserolle effarvatte se faufilant entre les hautes tiges de Phragmites australis. En observant ces épis bruissant sous la brise, j'ai mesuré toute la complexité de cet écosystème amphibie, véritable filtre naturel et refuge indispensable pour l'avifaune nichant au cœur de la vallée.","photo":"photos/omimg_20260811_102708.jpg","audio":null,"video":null},{"name":"Salicaire à feuilles effilées","lat":49.5475183,"lon":0.1997,"alt":15.38,"comment":"En arpentant les abords marécageux du sentier, j'ai soudain aperçu une flamboyante colonie de salicaires à feuilles effilées. En m'approchant pour cadrer ces épis d'un pourpre intense, j'ai revu l'histoire de cette hélophyte jadis employée pour ses vertus astringentes dans les pharmacopées traditionnelles. Tandis qu'un syrphe venait butiner ses fleurs sessiles, j'ai mesuré combien cette vigoureuse vivace illumine les milieux humides, offrant aux photographes un contrepoint chromatique saisissant.","photo":"photos/omimg_20260811_102755.jpg","audio":null,"video":null},{"name":"La Lézarde","lat":49.54988169999999,"lon":0.20322,"alt":20.94,"comment":"La Lézarde constitue le principal cours d'eau structurant cette vallée normande, jouant un rôle central dans l'histoire et l'aménagement du territoire. Son lit serpunit à travers des paysages variés, alternant zones humides, prairies et espaces urbains. En façonnant la topographie locale au fil des siècles, la rivière a favorisé l'implantation humaine et le développement économique, tout en abritant aujourd'hui un patrimoine naturel et paysager remarquable à préserver.","photo":"photos/omimg_20260811_103254.jpg","audio":null,"video":null},{"name":"Chemin traversant","lat":49.55156329999999,"lon":0.20448,"alt":20.06,"comment":"Un petit pont qui traverse la LKézarde.","photo":"photos/omimg_20260811_103612.jpg","audio":null,"video":null},{"name":"Cascade","lat":49.5518183,"lon":0.2046333,"alt":18.88,"comment":"En suivant le cours de la Lézarde, j'ai été surpris par le murmure soudain de cette cascade. Ce saut d'eau n'est pas seulement un spectacle enchanteur pour les yeux ; il témoigne du passé industriel de la vallée, où les moulins d'autrefois utilisaient la force du courant pour moudre le grain ou battre les toiles. En écoutant l'eau jaillir entre les rochers, on comprend comment ces petits aménagements façonnent encore aujourd'hui la poésie sauvage et vivante de notre itinéraire.","photo":"photos/omimg_20260811_103733.jpg","audio":null,"video":null},{"name":"Lac","lat":49.552255,"lon":0.2050933,"alt":20.81,"comment":"La construction du chemin de fer dans la vallée de la Lézarde, au XIXe siècle, a profondément bouleversé ce paysage façonné par l'eau. Pour tracer la voie ferrée reliant Le Havre à Rolleville et au-delà, les ingénieurs ont dû composer avec les méandres de la rivière, multipliant les remblais, les ponts et les tranchées. En arpentant ces vestiges ferroviaires devenus sentiers, le randonneur mesure l'impact titanesque de cette révolution industrielle qui a redessiné durablement l'économie et la géographie locale.","photo":"photos/omimg_20260811_103833.jpg","audio":null,"video":null},{"name":"Lac","lat":49.55374669999999,"lon":0.20854,"alt":22.55,"comment":"Le creusement des emprises et des tranchées nécessaires à l'établissement de la voie ferrée dans la vallée de la Lézarde a profondément remodelé la topographie locale. Pour asseoir la ligne et façonner son lit de ballast — cette couche de pierres concassées indispensable pour stabiliser les rails, drainer l'eau et répartir la charge des convois —, les terrassiers ont dû entailler les coteaux calcaires. Ces chantiers titanesques du XIXe siècle ont ainsi donné naissance à de profondes entailles paysagères, révélant la géologie des lieux tout en unissant à jamais le ruban d'acier au cours sinueux","photo":"photos/omimg_20260811_104224.jpg","audio":null,"video":null},{"name":"Sente du chemin de fer","lat":49.5552317,"lon":0.2114583,"alt":25.04,"comment":"Le chemin de fer de la Lézarde, qui reliait Le Havre à Rolleville en épousant les méandres de la rivière, a longtemps rythmé la vie de cette vallée industrielle et rurale. Inaugurée à la fin du XIXe siècle et familièrement surnommée le train des ouvriers, cette ligne historique — un temps valorisée sous le nom de Lézard'Express Régionale (LER) — a profondément structuré le territoire. En longeant ses emprises devenues chemins de randonnée, le marcheur devine l'empreinte de ce ruban d'acier qui, entre coteaux calcaires et zones humides, continue de narrer la grande aventure industrielle.","photo":"photos/omimg_20260811_104550.jpg","audio":null,"video":null},{"name":"Moulin de la Drille","lat":49.5561083,"lon":0.2157633,"alt":20.79,"comment":"Le **Moulin de la Drille**, situé à Épouville le long de la Lézarde, tire son nom du terme ancien *drille*, qui désigne un petit cours d'eau, un filet d'eau ou un canal de dérivation alimentant le mécanisme hydraulique. Dans les parlers régionaux et l'ancien français, la « drille » pouvait aussi faire référence au courant ou à un petit bief.\n\nBâti au XVIIe siècle et ayant évolué au fil du temps (successivement moulin à huile, à foulon, à papier puis à blé), il doit ainsi son appellation à l'eau vive qui s'écoulait activement pour actionner sa roue et rythmer l'activité industrielle de la vallé","photo":"photos/omimg_20260811_105129.jpg","audio":null,"video":null},{"name":"Canal de dérivation","lat":49.5557767,"lon":0.216055,"alt":20.71,"comment":"Ce canal de dérivation, ou bief, témoigne de la maîtrise hydraulique nécessaire au fonctionnement des anciens moulins de la vallée. En détournant une partie du cours de la Lézarde, cet ouvrage artificiel permettait de concentrer le débit et de générer la pression hydraulique requise pour actionner les roues à aubes. Au-delà de sa fonction technique initiale, ce dispositif structure aujourd'hui le paysage, illustrant l'intégration durable des aménagements industriels au sein de l'écosystème riverain.","photo":"photos/omimg_20260811_105211.jpg","audio":null,"video":null},{"name":"Vallée de la Lézarde","lat":49.556175,"lon":0.2198217,"alt":40.79,"comment":"Façonnée par le temps et murmurée par l'eau, la vallée de la Lézarde dévoile une mémoire vive où se tissent nature et vestiges d'antan. Entre coteaux verdoyants et méandres secrets, chaque pas résonne comme un voyage à travers les siècles, révélant comment le travail des hommes et le souffle de la rivière ont sculpté ce paysage enchanteur. Un véritable écrin patrimonial où l'histoire se lit au fil du courant et des sentiers.","photo":"photos/omimg_20260811_105600.jpg","audio":null,"video":null},{"name":"Tulipier de Chine","lat":49.5615783,"lon":0.22369,"alt":36.85,"comment":"Le tulipier de Chine (*Liriodendron chinense*) se distingue par son feuillage caduc aux lobes caractéristiques et sa floraison estivale en forme de tulipe. Apparenté aux magnoliacées, cet arbre remarquable témoigne de l'introduction d'espèces exotiques dans les parcs et domaines historiques de la vallée. Sa présence illustre la diversification arboricole passée, offrant aux botanistes l'opportunité d'étudier l'adaptation de ce taxon asiatique aux conditions pédoclimatiques normandes.","photo":"photos/omimg_20260811_110818.jpg","audio":null,"video":null},{"name":"Ferme du Gray","lat":49.572795,"lon":0.2250717,"alt":44.06,"comment":"Implantée sur le territoire de Rolleville, la Ferme du Gray témoigne de l'organisation architecturale et agricole traditionnelle du pays de Caux. Son corps de bâtiment principal, représentatif de l'habitat rural normand en calcaire et silex, illustre l'exploitation pérenne des terroirs limoneux du plateau. Cet ensemble patrimonial met en lumière l'histoire agraire locale, où les structures foncières anciennes continuent d'ancrer le paysage rural contemporain de la vallée.","photo":"photos/omimg_20260811_112643.jpg","audio":null,"video":null},{"name":"Pont sur la Lézarde","lat":49.5719017,"lon":0.2228033,"alt":32.47,"comment":"Longue d'environ 14,5 kilomètres, la Lézarde présente un profil caractéristique des rivières côtières normandes : un bassin versant modeste de 116 km² mais doté d'un fort dénivelé (environ 44 mètres de dénivelé global depuis sa source à Saint-Martin-du-Bec jusqu'à son exutoire). Ce relief marqué engendre un débit réactif et dynamique, autrefois intensément mis à contribution pour alimenter les biefs, les moulins et les activités industrielles de la vallée.","photo":"photos/omimg_20260811_113300.jpg","audio":null,"video":null},{"name":"Arrivée","lat":49.58225,"lon":0.2142217,"alt":39.45,"comment":"Grande randonnée Heure de départ: 09:04 11 août 2026 Heure d'arrivée: 11:56 11 août 2026 Distance: 12,0km (02:52) Temps déplacement: 02:37 Vitesse moyenne: 4,17 km/h Vitesse en mouvement: 4,56 km/h Vitesse Max.: 10,08 km/h Altitude minimale: 16 m Altitude maximale: 97 m Vitesse de montée: 159,3 m/h Vitesse de descente: 138,7 m/h Dénivelé positif: 163 m Dénivelé négatif: 158 m Temps de montée: 01:01 Temps de descente: 01:08.","photo":null,"audio":null,"video":null}];
